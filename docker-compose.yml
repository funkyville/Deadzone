version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: survival_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: survival_game
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d survival_game"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: survival_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: survival_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/survival_game
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_super_secret_jwt_key_change_in_production_32_chars_min
      JWT_EXPIRES_IN: 7d
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  pgdata:
  redisdata:
