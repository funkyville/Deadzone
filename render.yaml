services:
  - type: web
    name: survival-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: survival_postgres
          property: connectionString
      - key: REDIS_URL
        sync: false  # Set later to Upstash URL (optional - app runs without it)
        # App will log "Redis failed" warning but still run if empty

databases:
  - name: survival_postgres
    plan: free
    databaseName: survival_game
    user: survival_user
    region: oregon
