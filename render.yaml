services:
  - type: web
    name: survival-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        sync: false  # Set to your Render Postgres URL
      - key: REDIS_URL
        sync: false  # Set to your Upstash/Render Redis URL

databases:
  - name: survival_postgres
    plan: free
    databaseName: survival_game
    user: survival_user
